name: Praxis checks
on: [push, pull_request]
jobs:
  public-documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix website
      - run: npm test --prefix website
      - run: npm run build --prefix website
      - name: Build an independent documentation checkout
        run: |
          mkdir /tmp/praxis-documentation
          tar -C website --exclude=.git --exclude=node_modules --exclude=dist --exclude=.generated --exclude=.build-staging -cf - . | tar -C /tmp/praxis-documentation -xf -
          cd /tmp/praxis-documentation
          npm ci --include=dev
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: public-documentation
          path: website/dist
  project-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRAXIS_REQUIRE_EXTERNAL_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-pictures fonts-texgyre lmodern poppler-utils
      - run: uv sync --locked
      - run: uv run python tools/check_project_documents.py --output .praxis-output/project-documents
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-project-documents
          include-hidden-files: true
          path: .praxis-output/project-documents
  knowledge-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: docker build --tag project-praxis:0.1.0 .
      - name: Exercise Docker MCP and bundle isolation
        run: |
          uv run python tools/check_container_mcp.py --image project-praxis:0.1.0 --bundle bundles/stm32f407g-disc1-e01-timer-irq-v1 --bundle bundles/stm32f407g-disc1-e01-timer-routes-v1 --bundle bundles/atmega328p --output /tmp/praxis-container-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-container-evidence
          path: /tmp/praxis-container-report.json
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRAXIS_REQUIRE_EXTERNAL_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra web
      - name: Reuse pinned raw manufacturer sources
        uses: actions/cache@v4
        with:
          path: .praxis-output/source-downloads
          key: ${{ runner.os }}-manufacturer-sources-v1-${{ hashFiles('sources/stm32f407g-disc1/source-replay.json') }}
      - name: Acquire and verify manufacturer evidence once
        run: |
          set -o pipefail
          mkdir -p .praxis-output
          uv run python tools/restore_source_inputs.py --manifest sources/stm32f407g-disc1/source-replay.json --profile sources/stm32f407g-disc1/profile-timer-irq-v1.json --cache .praxis-output/source-downloads --download-only --download-attempts 4 --read-timeout 60 2>&1 | tee .praxis-output/source-download.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-acquisition-log
          include-hidden-files: true
          path: .praxis-output/source-download.log
  tests:
    needs: source-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRAXIS_REQUIRE_EXTERNAL_TOOLS: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends kicad podman uidmap clang gcc-arm-none-eabi libnewlib-arm-none-eabi gcc-avr avr-libc device-tree-compiler libfdt1 openocd
      - run: uv sync --locked --extra ingest --extra test --extra web
      - run: uv run ruff check praxis tests tools server.py compiler.py
      - name: Restore shared pinned source cache
        uses: actions/cache/restore@v4
        with:
          path: .praxis-output/source-downloads
          key: ${{ runner.os }}-manufacturer-sources-v1-${{ hashFiles('sources/stm32f407g-disc1/source-replay.json') }}
          fail-on-cache-miss: true
      - name: Restore pinned manufacturer evidence
        run: |
          set -o pipefail
          mkdir -p .praxis-output
          uv run python tools/restore_source_inputs.py --manifest sources/stm32f407g-disc1/source-replay.json --profile sources/stm32f407g-disc1/profile-timer-irq-v1.json --cache .praxis-output/source-downloads --offline 2>&1 | tee .praxis-output/source-restore.log
      - uses: ./.github/actions/provision-toolchain
      - name: Full strict regression
        run: |
          set -o pipefail
          uv run pytest -q --junitxml=.praxis-output/pytest-results.xml 2>&1 | tee .praxis-output/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          include-hidden-files: true
          path: |
            .praxis-output/source-restore.log
            .praxis-output/pytest-results.xml
            .praxis-output/pytest.log
      - run: uv run praxis lint --bundle bundles/stm32f401re && uv run praxis lint --bundle bundles/atmega328p
      - run: uv run praxis evaluate --bundle bundles/stm32f401re && uv run praxis evaluate --bundle bundles/atmega328p
      - run: uv run praxis lint --bundle bundles/stm32f407vgt6 && uv run praxis evaluate --bundle bundles/stm32f407vgt6
      - run: uv run praxis lint --bundle bundles/stm32f407g-disc1-e01-m1
      - run: uv run praxis lint --bundle bundles/stm32f407g-disc1-e01-discovery-v2 && uv run praxis lint --bundle bundles/stm32f407g-disc1-e01-uart-v1
      - run: uv run praxis lint --bundle bundles/stm32f407g-disc1-e01-features-v1
      - run: uv run praxis lint --bundle bundles/stm32f407g-disc1-e01-clock-v1
      - run: uv run praxis lint --bundle bundles/stm32f407g-disc1-e01-adc-v1
      - run: uv run praxis lint --bundle bundles/stm32f407g-disc1-e01-i2c-v1
      - run: uv run praxis lint --bundle bundles/stm32f407g-disc1-e01-can-v1
      - run: uv run praxis support --bundle bundles/stm32f407g-disc1-e01-can-v1 --catalog examples/capabilities/stm32f407g-disc1-can.json --workflow can1_silent_loopback_irq
      - run: uv run python tools/check_workflow_mcp.py --bundle bundles/stm32f407g-disc1-e01-can-v1 --workflow can1_silent_loopback_irq --blocked-workflow feature_can --blocked-workflow can1_external_bus --mode can/silent_loopback --mode can/silent_loopback_fifo0_irq --mode rcc/can1_gate_reset --mode nvic/can1_rx0_prepare --output /tmp/praxis-can-retrieval
      - run: uv run python tools/check_workflow_mcp.py --bundle bundles/stm32f407g-disc1-e01-i2c-v1 --workflow i2c1_controller_transmit --blocked-workflow feature_i2c --blocked-workflow i2c1_wired_transmit --mode i2c/controller_transmit_polling --mode rcc/i2c1_gate_reset --peripheral flash --peripheral pwr --forbid-register i2c/FLTR --output /tmp/praxis-i2c-retrieval
      - run: uv run praxis support --bundle bundles/stm32f407g-disc1-e01-i2c-v1 --catalog examples/capabilities/stm32f407g-disc1-i2c.json --workflow i2c1_controller_transmit
      - run: uv run python tools/check_adc_workflow_mcp.py --bundle bundles/stm32f407g-disc1-e01-adc-v1 --output /tmp/praxis-adc-retrieval
      - run: uv run praxis support --bundle bundles/stm32f407g-disc1-e01-clock-v1 --catalog examples/capabilities/stm32f407g-disc1.json --workflow uart_timer_interrupts
      - run: uv run python tools/check_feature_modes_mcp.py --bundle bundles/stm32f407g-disc1-e01-clock-v1 --expect-rng-clock-ready --output /tmp/praxis-clock-retrieval
      - run: uv run python tools/check_feature_modes_mcp.py --bundle bundles/stm32f407g-disc1-e01-features-v1 --output /tmp/praxis-feature-retrieval
      - name: Check public source packaging
        run: |
          uv build --out-dir /tmp/praxis-dist
          uv run python tools/check_distribution.py /tmp/praxis-dist
  kicad-ingestion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends kicad clang gcc-arm-none-eabi libnewlib-arm-none-eabi gcc-avr avr-libc device-tree-compiler libfdt1 openocd
      - run: uv sync --locked --extra ingest --extra test --extra web
      - run: uv run python tools/milestone1_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone1-acceptance
          path: .praxis-output/milestone1/report.json
  isolated-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y podman uidmap gcc-arm-none-eabi
      - run: uv sync --locked --extra build --extra test
      - uses: ./.github/actions/provision-toolchain
      - run: PRAXIS_REQUIRE_EXTERNAL_TOOLS=1 uv run pytest -q tests/test_firmware_build.py tests/test_verification.py tests/test_uart_loopback.py
      - run: uv run python tools/check_feature_modes_mcp.py --bundle bundles/stm32f407g-disc1-e01-features-v1 --source-directory stm32f407g-disc1-crc-dma/application --output /tmp/praxis-feature-build
      - run: uv run python tools/check_feature_modes_mcp.py --bundle bundles/stm32f407g-disc1-e01-clock-v1 --expect-rng-clock-ready --source-directory stm32f407g-disc1-clock/application --output /tmp/praxis-clock-build
      - run: uv run python tools/check_adc_workflow_mcp.py --bundle bundles/stm32f407g-disc1-e01-adc-v1 --source-directory stm32f407g-disc1-adc/application --output /tmp/praxis-adc-build
      - run: PRAXIS_REQUIRE_EXTERNAL_TOOLS=1 uv run pytest -q tests/test_i2c_modes.py
      - run: PRAXIS_REQUIRE_EXTERNAL_TOOLS=1 uv run pytest -q tests/test_can_modes.py
      - run: PRAXIS_REQUIRE_EXTERNAL_TOOLS=1 uv run pytest -q tests/test_can_telemetry.py
      - run: uv run python tools/check_workflow_mcp.py --bundle bundles/stm32f407g-disc1-e01-can-v1 --workflow can1_silent_loopback_irq --blocked-workflow feature_can --blocked-workflow can1_external_bus --mode can/silent_loopback --mode can/silent_loopback_fifo0_irq --mode rcc/can1_gate_reset --mode nvic/can1_rx0_prepare --source-directory stm32f407g-disc1-can/telemetry_application --output /tmp/praxis-can-telemetry-build
      - run: uv run python tools/check_workflow_mcp.py --bundle bundles/stm32f407g-disc1-e01-can-v1 --workflow can1_silent_loopback_irq --blocked-workflow feature_can --blocked-workflow can1_external_bus --mode can/silent_loopback --mode can/silent_loopback_fifo0_irq --mode rcc/can1_gate_reset --mode nvic/can1_rx0_prepare --source-directory stm32f407g-disc1-can/application --output /tmp/praxis-can-build
      - run: uv run python tools/check_workflow_mcp.py --bundle bundles/stm32f407g-disc1-e01-i2c-v1 --workflow i2c1_controller_transmit --blocked-workflow feature_i2c --blocked-workflow i2c1_wired_transmit --mode i2c/controller_transmit_polling --mode rcc/i2c1_gate_reset --peripheral flash --peripheral pwr --forbid-register i2c/FLTR --source-directory stm32f407g-disc1-i2c/application --output /tmp/praxis-i2c-build
      - name: Replay all current F407 application cases through MCP
        run: |
          PRAXIS_REQUIRE_EXTERNAL_TOOLS=1 uv run python tools/check_target_acceptance_mcp.py --bundle bundles/stm32f407g-disc1-e01-timer-irq-v1 --plan examples/acceptance/stm32f407g-disc1-timer-irq.json --catalog examples/capabilities/stm32f407g-disc1-timer-irq.json --workspace examples --assets assets/stm32f407vg --lock toolchain-f407.lock.json --inventory examples/inventory/stm32f407g-disc1/inventory-v2.json --output .praxis-output/ci-f407-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f407-application-acceptance
          include-hidden-files: true
          path: |
            .praxis-output/ci-f407-acceptance/report.json
            .praxis-output/ci-f407-acceptance/trace.json
